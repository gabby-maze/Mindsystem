[build]
  command   = "cd /opt/build/repo && pnpm install --frozen-lockfile && pnpm --filter @workspace/mindsystem-home run build"
  publish   = "dist/public"

[build.environment]
  BASE_PATH    = "/"
  PORT         = "3000"
  NODE_VERSION = "20"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
