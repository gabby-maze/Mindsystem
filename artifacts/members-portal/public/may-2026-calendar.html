<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>May 2026 Call Schedule</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0A0A0A;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 20px 16px 28px;
    min-height: 100vh;
    min-width: 620px;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header-brand {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #00D4C8;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .header-title {
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #FFFFFF;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: #888;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-parent  { background: #00D4C8; }
  .dot-athlete { background: rgba(0,212,200,0.4); border: 1.5px solid #00D4C8; }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 20px;
  }
  .day-header {
    text-align: center;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #555;
    padding: 8px 2px;
  }
  .day-cell {
    background: #1A1A1A;
    border: 1px solid #222;
    border-radius: 6px;
    min-height: 54px;
    padding: 6px 5px;
    border-left: 3px solid #222;
  }
  .day-cell.empty {
    background: transparent;
    border-color: transparent;
  }
  .day-cell.has-calls {
    min-height: 108px;
    border-left: 3px solid #00D4C8;
  }
  .day-number {
    font-size: 11px;
    font-weight: 600;
    color: #555;
    margin-bottom: 4px;
    line-height: 1;
  }
  .day-cell.has-calls .day-number { color: #fff; }

  .call-entry { margin-top: 4px; }
  .call-divider {
    height: 1px;
    background: #2A2A2A;
    margin: 5px 0;
  }
  .call-pill {
    display: inline-block;
    font-size: 7px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 2px 6px;
    border-radius: 20px;
    margin-bottom: 3px;
  }
  .pill-parent {
    background: rgba(0,212,200,0.2);
    color: #00D4C8;
    border: 1px solid rgba(0,212,200,0.45);
  }
  .pill-athlete {
    background: rgba(0,212,200,0.08);
    color: rgba(0,212,200,0.75);
    border: 1px solid rgba(0,212,200,0.22);
  }
  .call-time {
    font-size: 8.5px;
    color: #ccc;
    font-weight: 500;
    line-height: 1.4;
  }

  .footer-note {
    text-align: center;
    font-size: 10px;
    color: #444;
    line-height: 1.7;
    border-top: 1px solid #1E1E1E;
    padding-top: 14px;
  }

  @media (max-width: 480px) {
    body { padding: 14px 10px 20px; }
    .day-header { font-size: 7.5px; padding: 6px 1px; }
    .day-cell { min-height: 44px; padding: 4px 3px; border-radius: 4px; }
    .day-cell.has-calls { min-height: 96px; }
    .call-pill { font-size: 6px; padding: 1.5px 4px; }
    .call-time { font-size: 7.5px; }
    .day-number { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="header">
  <p class="header-brand">Maze Performance · MindSystem</p>
  <h1 class="header-title">May 2026 Call Schedule</h1>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-dot dot-parent"></div>
    <span>Parent Session</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot dot-athlete"></div>
    <span>Athlete Session</span>
  </div>
</div>

<div class="calendar" id="calendar"></div>

<div class="footer-note">
  All times listed in PST &nbsp;·&nbsp; Replays available within 24 hours of each session
</div>

<script>
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // May 2026: May 1 = Friday (day-of-week index 5), 31 days total
  const START_DOW = 5;
  const TOTAL_DAYS = 31;

  // Wednesdays in May: 6, 13, 20, 27  — Parent 9–10am PST | Athlete 5:30–6:30pm PST
  // Saturdays in May:  2, 9, 16, 23, 30 — Parent 10–11am PST | Athlete 11am–12pm PST
  const CALLS = {
    2:  [
      { type: 'parent',  time: '10:00 – 11:00 AM PST' },
      { type: 'athlete', time: '11:00 AM – 12:00 PM PST' },
    ],
    6:  [
      { type: 'parent',  time: '9:00 – 10:00 AM PST' },
      { type: 'athlete', time: '5:30 – 6:30 PM PST' },
    ],
    9:  [
      { type: 'parent',  time: '10:00 – 11:00 AM PST' },
      { type: 'athlete', time: '11:00 AM – 12:00 PM PST' },
    ],
    13: [
      { type: 'parent',  time: '9:00 – 10:00 AM PST' },
      { type: 'athlete', time: '5:30 – 6:30 PM PST' },
    ],
    16: [
      { type: 'parent',  time: '10:00 – 11:00 AM PST' },
      { type: 'athlete', time: '11:00 AM – 12:00 PM PST' },
    ],
    20: [
      { type: 'parent',  time: '9:00 – 10:00 AM PST' },
      { type: 'athlete', time: '5:30 – 6:30 PM PST' },
    ],
    23: [
      { type: 'parent',  time: '10:00 – 11:00 AM PST' },
      { type: 'athlete', time: '11:00 AM – 12:00 PM PST' },
    ],
    27: [
      { type: 'parent',  time: '9:00 – 10:00 AM PST' },
      { type: 'athlete', time: '5:30 – 6:30 PM PST' },
    ],
    30: [
      { type: 'parent',  time: '10:00 – 11:00 AM PST' },
      { type: 'athlete', time: '11:00 AM – 12:00 PM PST' },
    ],
  };

  const cal = document.getElementById('calendar');

  // Day-of-week headers
  DAYS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'day-header';
    el.textContent = d;
    cal.appendChild(el);
  });

  // Empty cells before May 1
  for (let i = 0; i < START_DOW; i++) {
    const el = document.createElement('div');
    el.className = 'day-cell empty';
    cal.appendChild(el);
  }

  // Day cells
  for (let day = 1; day <= TOTAL_DAYS; day++) {
    const calls = CALLS[day] || [];
    const el = document.createElement('div');
    el.className = 'day-cell' + (calls.length ? ' has-calls' : '');

    let html = `<div class="day-number">${day}</div>`;
    calls.forEach((c, i) => {
      if (i > 0) html += '<div class="call-divider"></div>';
      const label = c.type === 'parent' ? 'Parent' : 'Athlete';
      const pillClass = c.type === 'parent' ? 'pill-parent' : 'pill-athlete';
      html += `
        <div class="call-entry">
          <span class="call-pill ${pillClass}">${label}</span>
          <div class="call-time">${c.time}</div>
        </div>`;
    });

    el.innerHTML = html;
    cal.appendChild(el);
  }

  // Fill remainder of last row
  const totalCells = START_DOW + TOTAL_DAYS;
  const remainder = totalCells % 7;
  if (remainder !== 0) {
    for (let i = 0; i < (7 - remainder); i++) {
      const el = document.createElement('div');
      el.className = 'day-cell empty';
      cal.appendChild(el);
    }
  }
</script>
</body>
</html>
