<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>May 2026 Call Schedule</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0A0A0A;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 20px 16px 28px;
    min-height: 100vh;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header-brand {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #FF1C84;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .header-title {
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #FFFFFF;
  }
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 20px;
  }
  .day-header {
    text-align: center;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #888888;
    padding: 8px 2px;
  }
  .day-cell {
    background: #1A1A1A;
    border: 1px solid #2A2A2A;
    border-radius: 6px;
    min-height: 52px;
    padding: 6px 5px;
    position: relative;
    border-left: 3px solid #2A2A2A;
  }
  .day-cell.empty {
    background: transparent;
    border-color: transparent;
  }
  .day-cell.has-calls {
    min-height: 80px;
    padding: 6px 5px 8px;
  }
  .day-cell.has-two-calls {
    min-height: 110px;
  }
  .day-cell.athlete-first {
    border-left: 3px solid #FF1C84;
  }
  .day-cell.parent-first {
    border-left: 3px solid #8B5CF6;
  }
  .day-cell.split-border {
    border-left: none;
    position: relative;
  }
  .day-cell.split-border::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 50%;
    width: 3px;
    background: #FF1C84;
    border-radius: 6px 0 0 0;
  }
  .day-cell.split-border::after {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    bottom: 0;
    width: 3px;
    background: #8B5CF6;
    border-radius: 0 0 0 6px;
  }
  .day-number {
    font-size: 11px;
    font-weight: 600;
    color: #888888;
    margin-bottom: 4px;
    line-height: 1;
  }
  .day-cell.has-calls .day-number {
    color: #FFFFFF;
  }
  .call-entry {
    margin-top: 4px;
  }
  .call-divider {
    height: 1px;
    background: #2A2A2A;
    margin: 5px 0;
  }
  .call-pill {
    display: inline-block;
    font-size: 7.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 2px 6px;
    border-radius: 20px;
    margin-bottom: 3px;
  }
  .pill-athlete {
    background: rgba(255, 28, 132, 0.2);
    color: #FF1C84;
    border: 1px solid rgba(255, 28, 132, 0.4);
  }
  .pill-parent {
    background: rgba(139, 92, 246, 0.2);
    color: #8B5CF6;
    border: 1px solid rgba(139, 92, 246, 0.4);
  }
  .call-time-pst {
    font-size: 8.5px;
    color: #FFFFFF;
    font-weight: 500;
    line-height: 1.3;
  }
  .call-time-est {
    font-size: 7.5px;
    color: #888888;
    line-height: 1.3;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 14px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: #888888;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-athlete { background: #FF1C84; }
  .dot-parent  { background: #8B5CF6; }
  .footer-note {
    text-align: center;
    font-size: 10px;
    color: #555555;
    line-height: 1.7;
    border-top: 1px solid #1E1E1E;
    padding-top: 14px;
  }

  @media (max-width: 480px) {
    body { padding: 14px 10px 20px; }
    .day-header { font-size: 7.5px; padding: 6px 1px; }
    .day-cell { min-height: 44px; padding: 4px 3px; border-radius: 4px; }
    .day-cell.has-calls { min-height: 70px; }
    .day-cell.has-two-calls { min-height: 100px; }
    .call-pill { font-size: 6.5px; padding: 1.5px 4px; }
    .call-time-pst { font-size: 7px; }
    .call-time-est { font-size: 6.5px; }
    .day-number { font-size: 10px; }
    .legend { gap: 14px; }
    .legend-item { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="header">
  <p class="header-brand">MazePerformance · MindSystem</p>
  <h1 class="header-title">May 2026 Call Schedule</h1>
</div>

<div class="calendar" id="calendar"></div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-dot dot-athlete"></div>
    <span>Athlete Group Call</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot dot-parent"></div>
    <span>Parent Group Call</span>
  </div>
</div>

<div class="footer-note">
  All calls require a pre-call form submission 24 hours in advance.<br>
  Times shown in PST and EST.
</div>

<script>
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // May 2026: starts Friday (day index 5), 31 days
  const START_DOW = 5;
  const TOTAL_DAYS = 31;

  // Call data keyed by day number
  const CALLS = {
    17: [
      { type: 'athlete', label: 'Athlete Group Call', pst: '12:00–1:00 PM PST', est: '3:00–4:00 PM EST' },
      { type: 'parent',  label: 'Parent Group Call',  pst: '4:00–5:00 PM PST',  est: '7:00–8:00 PM EST' },
    ],
    27: [
      { type: 'parent',  label: 'Parent Group Call',  pst: '9:00–10:00 AM PST', est: '12:00–1:00 PM EST' },
      { type: 'athlete', label: 'Athlete Group Call', pst: '5:30–6:30 PM PST',  est: '8:30–9:30 PM EST' },
    ],
    31: [
      { type: 'athlete', label: 'Athlete Group Call', pst: '12:00–1:00 PM PST', est: '3:00–4:00 PM EST' },
      { type: 'parent',  label: 'Parent Group Call',  pst: '4:00–5:00 PM PST',  est: '7:00–8:00 PM EST' },
    ],
  };

  const cal = document.getElementById('calendar');

  // Day headers
  DAYS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'day-header';
    el.textContent = d;
    cal.appendChild(el);
  });

  // Empty cells before May 1
  for (let i = 0; i < START_DOW; i++) {
    const el = document.createElement('div');
    el.className = 'day-cell empty';
    cal.appendChild(el);
  }

  // Day cells
  for (let day = 1; day <= TOTAL_DAYS; day++) {
    const calls = CALLS[day] || [];
    const el = document.createElement('div');

    let cls = 'day-cell';
    if (calls.length === 1) {
      cls += ' has-calls ' + (calls[0].type === 'athlete' ? 'athlete-first' : 'parent-first');
    } else if (calls.length === 2) {
      cls += ' has-calls has-two-calls';
      if (calls[0].type === 'athlete' && calls[1].type === 'parent') {
        cls += ' split-border';
      } else if (calls[0].type === 'parent' && calls[1].type === 'athlete') {
        cls += ' split-border';
      } else {
        cls += ' ' + (calls[0].type === 'athlete' ? 'athlete-first' : 'parent-first');
      }
    }

    el.className = cls;

    let html = `<div class="day-number">${day}</div>`;
    calls.forEach((c, i) => {
      if (i > 0) html += '<div class="call-divider"></div>';
      html += `
        <div class="call-entry">
          <span class="call-pill ${c.type === 'athlete' ? 'pill-athlete' : 'pill-parent'}">${c.type === 'athlete' ? 'Athlete' : 'Parent'}</span>
          <div class="call-time-pst">${c.pst}</div>
          <div class="call-time-est">${c.est}</div>
        </div>`;
    });

    el.innerHTML = html;
    cal.appendChild(el);
  }

  // Fill remaining cells to complete the last row
  const totalCells = START_DOW + TOTAL_DAYS;
  const remainder = totalCells % 7;
  if (remainder !== 0) {
    for (let i = 0; i < (7 - remainder); i++) {
      const el = document.createElement('div');
      el.className = 'day-cell empty';
      cal.appendChild(el);
    }
  }
</script>
</body>
</html>
